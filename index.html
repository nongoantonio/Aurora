<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a12" />

    <title>Aurora Cloud — Evolua a sua presença digital com inteligência</title>
    <meta
      name="description"
      content="Hospedagem, segurança e análise em tempo real para o seu negócio digital. Planos a partir de 0 Kz, sem cartão de crédito."
    />
    <meta name="keywords" content="hospedagem, hosting, domínios, segurança digital, análise de tráfego, Angola" />
    <meta name="author" content="Aurora Cloud" />
    <link rel="canonical" href="https://www.aurora.co.ao/" />

    <!--
      ATENÇÃO: troque "https://www.aurora.co.ao" por o domínio real do site
      nas tags abaixo (canonical, og:*, twitter:*) assim que o tiver, e
      atualize também public/robots.txt e public/sitemap.xml.
    -->
    <!-- Open Graph (WhatsApp, Facebook, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Aurora Cloud" />
    <meta property="og:title" content="Aurora Cloud — Evolua a sua presença digital com inteligência" />
    <meta
      property="og:description"
      content="Hospedagem, segurança e análise em tempo real para o seu negócio digital. Planos a partir de 0 Kz, sem cartão de crédito."
    />
    <meta property="og:image" content="https://www.aurora.co.ao/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://www.aurora.co.ao/" />
    <meta property="og:locale" content="pt_PT" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Aurora Cloud — Evolua a sua presença digital com inteligência" />
    <meta
      name="twitter:description"
      content="Hospedagem, segurança e análise em tempo real para o seu negócio digital."
    />
    <meta name="twitter:image" content="https://www.aurora.co.ao/og-image.png" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('aurora-theme');
          var theme = saved === 'light' || saved === 'dark'
            ? saved
            : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
