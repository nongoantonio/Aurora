<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <title>Aurora Cloud</title>
    <!--
      Técnica padrão para Single Page Apps (React Router) no GitHub Pages.
      O GitHub Pages não sabe servir rotas como /termos-de-servico diretamente
      (dá 404 real). Este ficheiro é servido automaticamente nesse caso e
      redireciona para index.html, preservando o caminho pedido através da
      query string — o script em index.html reconstrói o URL correto.
      Referência: https://github.com/rafgraph/spa-github-pages
    -->
    <script>
      var segmentCount = 1; // número de segmentos do "base path" (nome do repositório)
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
